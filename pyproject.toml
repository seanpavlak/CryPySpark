[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypyspark"
version = "0.1.0"
description = "Type-preserving encryption and decryption for PySpark columns of any type"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sean Pavlak" }]
requires-python = ">=3.9"
keywords = ["pyspark", "spark", "databricks", "encryption", "aes", "pii", "unity-catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
]
# pyspark is provided by the runtime on Databricks, so it is an optional extra.
dependencies = []

[project.urls]
Homepage = "https://github.com/seanpavlak/CryPySpark"
Issues = "https://github.com/seanpavlak/CryPySpark/issues"

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
test = ["pyspark>=3.5", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/crypyspark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
